openapi: 3.0.3
info:
  title: A2BillingPlus REST API
  version: 0.1.0-alpha
  description: Versioned API for external integrations with A2BillingPlus.
servers:
  - url: /api/v1
security:
  - ServiceKey: []
components:
  securitySchemes:
    ServiceKey:
      type: http
      scheme: bearer
      bearerFormat: service-key
  schemas:
    ApiSuccess:
      type: object
      required: [api_version, success, data]
      properties:
        api_version:
          type: string
          example: v1
        success:
          type: boolean
          example: true
        data:
          type: object
        meta:
          type: object
    ApiError:
      type: object
      required: [api_version, success, error]
      properties:
        api_version:
          type: string
          example: v1
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: invalid_service_key
            message:
              type: string
            details:
              type: object
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    CustomerSearch:
      name: search
      in: query
      description: Match username, user alias, first name, last name, or email.
      schema:
        type: string
        maxLength: 100
    CustomerStatus:
      name: status
      in: query
      description: Filter by customer status, where 1 is active and 0 is blocked or inactive.
      schema:
        type: integer
        enum: [0, 1]
    RatePrefix:
      name: prefix
      in: query
      description: Match rate rows whose dial prefix starts with this value.
      schema:
        type: string
        pattern: '^[0-9*#+]+$'
    TariffPlanId:
      name: tariff_plan_id
      in: query
      description: Filter rates by tariff plan id.
      schema:
        type: integer
        minimum: 1
    RateTag:
      name: tag
      in: query
      description: Filter rates by provider/import tag.
      schema:
        type: string
        maxLength: 100
    DateFrom:
      name: from
      in: query
      description: Inclusive UTC date/time filter, YYYY-MM-DD or YYYY-MM-DD HH:MM:SS.
      schema:
        type: string
    DateTo:
      name: to
      in: query
      description: Exclusive UTC date/time filter, YYYY-MM-DD or YYYY-MM-DD HH:MM:SS.
      schema:
        type: string
    CustomerId:
      name: customer_id
      in: query
      schema:
        type: integer
        minimum: 1
    CalledStation:
      name: calledstation
      in: query
      description: Match called destination digits.
      schema:
        type: string
        maxLength: 64
  responses:
    Unauthorized:
      description: Missing bearer service key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Invalid bearer service key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
paths:
  /customers.php:
    get:
      summary: List customer accounts or load one customer by id
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: id
          in: query
          description: When present, return one customer detail record.
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/CustomerSearch'
        - $ref: '#/components/parameters/CustomerStatus'
      responses:
        '200':
          description: Customer rows from cc_card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      summary: Activate or block a customer account
      parameters:
        - name: X-A2BP-Actor
          in: header
          description: Optional audit actor identifier.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, status]
              properties:
                id:
                  type: integer
                  minimum: 1
                status:
                  type: integer
                  enum: [0, 1]
      responses:
        '200':
          description: Updated customer record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /balances.php:
    get:
      summary: List customer balances
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Balance rows from cc_card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
  /rates.php:
    get:
      summary: List rate rows with module-backed filters
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/RatePrefix'
        - $ref: '#/components/parameters/TariffPlanId'
        - $ref: '#/components/parameters/RateTag'
      responses:
        '200':
          description: Rate rows from cc_ratecard.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
  /payments.php:
    get:
      summary: List payment ledger rows with module-backed filters
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Payment rows from cc_logpayment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
  /cdrs.php:
    get:
      summary: List call detail records with module-backed filters
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/CustomerId'
        - $ref: '#/components/parameters/CalledStation'
      responses:
        '200':
          description: CDR rows from cc_call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
  /provider-records.php:
    get:
      summary: List provider database records
      description: The existing /providers.php path remains the VectaVoIP provider action endpoint.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Provider rows from cc_provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
  /invoices.php:
    get:
      summary: List invoices
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Invoice rows from cc_invoice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
