openapi: 3.0.3
info:
  title: A2BillingPlus REST API
  version: 0.1.0-alpha
  description: Versioned API for external integrations with A2BillingPlus.
servers:
  - url: /api/v1
security:
  - ServiceKey: []
components:
  securitySchemes:
    ServiceKey:
      type: http
      scheme: bearer
      bearerFormat: service-key
    CustomerIdHeader:
      type: apiKey
      in: header
      name: X-A2BP-Customer-Id
    CustomerSignatureHeader:
      type: apiKey
      in: header
      name: X-A2BP-Customer-Signature
  schemas:
    ApiSuccess:
      type: object
      required: [api_version, success, data]
      properties:
        api_version:
          type: string
          example: v1
        success:
          type: boolean
          example: true
        data:
          type: object
        meta:
          type: object
    ApiError:
      type: object
      required: [api_version, success, error]
      properties:
        api_version:
          type: string
          example: v1
        success:
          type: boolean
          example: false
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              example: invalid_service_key
            message:
              type: string
            details:
              type: object
  parameters:
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    CustomerSearch:
      name: search
      in: query
      description: Match username, user alias, first name, last name, or email.
      schema:
        type: string
        maxLength: 100
    CustomerStatus:
      name: status
      in: query
      description: Filter by customer status, where 1 is active and 0 is blocked or inactive.
      schema:
        type: integer
        enum: [0, 1]
    InvoicePaidStatus:
      name: paid_status
      in: query
      description: Filter invoices by paid status.
      schema:
        type: integer
        enum: [0, 1]
    RatePrefix:
      name: prefix
      in: query
      description: Match rate rows whose dial prefix starts with this value.
      schema:
        type: string
        pattern: '^[0-9*#+]+$'
    TariffPlanId:
      name: tariff_plan_id
      in: query
      description: Filter rates by tariff plan id.
      schema:
        type: integer
        minimum: 1
    RateTag:
      name: tag
      in: query
      description: Filter rates by provider/import tag.
      schema:
        type: string
        maxLength: 100
    DateFrom:
      name: from
      in: query
      description: Inclusive UTC date/time filter, YYYY-MM-DD or YYYY-MM-DD HH:MM:SS.
      schema:
        type: string
    DateTo:
      name: to
      in: query
      description: Exclusive UTC date/time filter, YYYY-MM-DD or YYYY-MM-DD HH:MM:SS.
      schema:
        type: string
    CustomerId:
      name: customer_id
      in: query
      schema:
        type: integer
        minimum: 1
    CalledStation:
      name: calledstation
      in: query
      description: Match called destination digits.
      schema:
        type: string
        maxLength: 64
  responses:
    Unauthorized:
      description: Missing bearer service key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: Invalid bearer service key.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
paths:
  /customers.php:
    get:
      summary: List customer accounts or load one customer by id
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: id
          in: query
          description: When present, return one customer detail record.
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/CustomerSearch'
        - $ref: '#/components/parameters/CustomerStatus'
      responses:
        '200':
          description: Customer rows from cc_card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    patch:
      summary: Activate or block a customer account
      parameters:
        - name: X-A2BP-Actor
          in: header
          description: Optional audit actor identifier.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, status]
              properties:
                id:
                  type: integer
                  minimum: 1
                status:
                  type: integer
                  enum: [0, 1]
      responses:
        '200':
          description: Updated customer record.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      summary: Create a customer account
      parameters:
        - name: X-A2BP-Actor
          in: header
          description: Optional audit actor identifier.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer]
              properties:
                customer:
                  type: object
                  required: [username, useralias, firstname, lastname, email]
                  properties:
                    username:
                      type: string
                      maxLength: 50
                    useralias:
                      type: string
                      maxLength: 50
                    firstname:
                      type: string
                      maxLength: 50
                    lastname:
                      type: string
                      maxLength: 50
                    email:
                      type: string
                      format: email
                      maxLength: 70
                    currency:
                      type: string
                      pattern: '^[A-Za-z]{3}$'
                      default: USD
                    status:
                      type: integer
                      enum: [0, 1]
                      default: 1
                    id_group:
                      type: integer
                      minimum: 1
                      default: 1
      responses:
        '201':
          description: Customer account created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    put:
      summary: Update customer contact, status, currency, or group assignment
      parameters:
        - name: X-A2BP-Actor
          in: header
          description: Optional audit actor identifier.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, customer]
              properties:
                id:
                  type: integer
                  minimum: 1
                customer:
                  type: object
                  properties:
                    useralias:
                      type: string
                      maxLength: 50
                    firstname:
                      type: string
                      maxLength: 50
                    lastname:
                      type: string
                      maxLength: 50
                    email:
                      type: string
                      format: email
                      maxLength: 70
                    currency:
                      type: string
                      pattern: '^[A-Za-z]{3}$'
                    status:
                      type: integer
                      enum: [0, 1]
                    id_group:
                      type: integer
                      minimum: 1
      responses:
        '200':
          description: Customer account updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Customer was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /balances.php:
    get:
      summary: List customer balances
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Balance rows from cc_card.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
  /customer-profile.php:
    get:
      summary: Load the signed customer profile, balance, and account status
      security:
        - CustomerIdHeader: []
          CustomerSignatureHeader: []
      responses:
        '200':
          description: Signed customer's profile, balance, and status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Customer was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
    put:
      summary: Update signed customer contact fields
      security:
        - CustomerIdHeader: []
          CustomerSignatureHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [customer]
              properties:
                customer:
                  type: object
                  properties:
                    firstname:
                      type: string
                      maxLength: 50
                    lastname:
                      type: string
                      maxLength: 50
                    email:
                      type: string
                      format: email
                      maxLength: 70
                    address:
                      type: string
                      maxLength: 100
                    city:
                      type: string
                      maxLength: 40
                    state:
                      type: string
                      maxLength: 40
                    country:
                      type: string
                      maxLength: 40
                    zipcode:
                      type: string
                      maxLength: 20
                    phone:
                      type: string
                      maxLength: 20
      responses:
        '200':
          description: Signed customer's contact fields updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /customer-invoices.php:
    get:
      summary: List or load invoices owned by the signed customer
      security:
        - CustomerIdHeader: []
          CustomerSignatureHeader: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: id
          in: query
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/InvoicePaidStatus'
      responses:
        '200':
          description: Signed customer's invoices or one invoice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Invoice was not found or is not owned by the signed customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /customer-receipts.php:
    get:
      summary: List or load receipts owned by the signed customer
      security:
        - CustomerIdHeader: []
          CustomerSignatureHeader: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: id
          in: query
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/CustomerStatus'
      responses:
        '200':
          description: Signed customer's receipts or one receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Receipt was not found or is not owned by the signed customer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /rates.php:
    get:
      summary: List rate rows, load one rate by id, or lookup destinations
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: id
          in: query
          description: When present, return one ratecard row.
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/RatePrefix'
        - name: destination
          in: query
          description: Match destination names for destination lookup mode.
          schema:
            type: string
            maxLength: 100
        - $ref: '#/components/parameters/TariffPlanId'
        - $ref: '#/components/parameters/RateTag'
      responses:
        '200':
          description: Rate rows, one rate row, or destination rows from cc_ratecard.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Rate was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /tariff-plans.php:
    get:
      summary: List tariff plans or load one tariff plan by id
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Tariff plan rows from cc_tariffplan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
    post:
      summary: Create a tariff plan
      parameters:
        - name: X-A2BP-Actor
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tariff]
              properties:
                tariff:
                  type: object
                  required: [tariffname]
                  properties:
                    tariffname:
                      type: string
                      maxLength: 50
                    description:
                      type: string
                    id_trunk:
                      type: integer
      responses:
        '201':
          description: Tariff plan created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '422':
          $ref: '#/components/responses/ValidationError'
    put:
      summary: Update a tariff plan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, tariff]
              properties:
                id:
                  type: integer
                  minimum: 1
                tariff:
                  type: object
      responses:
        '200':
          description: Tariff plan updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '404':
          description: Tariff plan was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /tariff-groups.php:
    get:
      summary: List tariff groups or load one tariff group by id
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: search
          in: query
          schema:
            type: string
            maxLength: 100
      responses:
        '200':
          description: Tariff group rows from cc_tariffgroup.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
    post:
      summary: Create a tariff group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tariff]
              properties:
                tariff:
                  type: object
                  required: [tariffgroupname, idtariffplan]
                  properties:
                    tariffgroupname:
                      type: string
                      maxLength: 50
                    idtariffplan:
                      type: integer
                      minimum: 1
                    lcrtype:
                      type: integer
      responses:
        '201':
          description: Tariff group created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '422':
          $ref: '#/components/responses/ValidationError'
    put:
      summary: Update a tariff group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, tariff]
              properties:
                id:
                  type: integer
                  minimum: 1
                tariff:
                  type: object
      responses:
        '200':
          description: Tariff group updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '404':
          description: Tariff group was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /rate-imports.php:
    post:
      summary: Dry-run or apply ratecard imports
      description: Applies supplied provider/manual rate rows through the module importer. Duplicate prefix/tag rows are skipped unless `update_existing` is enabled.
      parameters:
        - name: X-A2BP-Actor
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tariff_plan_id, tag, rows]
              properties:
                tariff_plan_id:
                  type: integer
                  minimum: 1
                tag:
                  type: string
                  maxLength: 100
                dry_run:
                  type: string
                  enum: ['0', '1']
                  default: '1'
                update_existing:
                  type: string
                  enum: ['0', '1']
                  default: '0'
                rows:
                  type: array
                  items:
                    type: object
                    required: [prefix, rate]
                    properties:
                      destination:
                        type: string
                      prefix:
                        type: string
                      rate:
                        type: string
                      buyrate:
                        type: string
                      increment:
                        type: integer
                        minimum: 1
      responses:
        '200':
          description: Rate import was accepted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /payments.php:
    get:
      summary: List payment ledger rows or load one payment by id
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: id
          in: query
          description: When present, return one payment ledger row.
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/CustomerId'
      responses:
        '200':
          description: Payment rows from cc_logpayment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
  /payment-reconciliation.php:
    get:
      summary: Summarize paid amount versus refilled balance
      parameters:
        - name: from
          in: query
          required: true
          description: Inclusive UTC date/time filter, YYYY-MM-DD or YYYY-MM-DD HH:MM:SS.
          schema:
            type: string
        - name: to
          in: query
          required: true
          description: Exclusive UTC date/time filter, YYYY-MM-DD or YYYY-MM-DD HH:MM:SS.
          schema:
            type: string
      responses:
        '200':
          description: Payment reconciliation totals from cc_logpayment.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /cdrs.php:
    get:
      summary: List, export, or load call detail records
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: id
          in: query
          description: When present, return one CDR row.
          schema:
            type: integer
            minimum: 1
        - $ref: '#/components/parameters/DateFrom'
        - $ref: '#/components/parameters/DateTo'
        - $ref: '#/components/parameters/CustomerId'
        - $ref: '#/components/parameters/CalledStation'
        - name: export
          in: query
          description: Set to 1 to return export rows for the requested date window.
          schema:
            type: string
            enum: ['0', '1']
            default: '0'
        - name: redact
          in: query
          description: Set to 0 only for trusted admin exports that may include full called station values.
          schema:
            type: string
            enum: ['0', '1']
            default: '1'
      responses:
        '200':
          description: CDR rows, one CDR row, or redacted export rows from cc_call.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '404':
          description: CDR was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          $ref: '#/components/responses/ValidationError'
  /reports.php:
    get:
      summary: Run billing and call quality reports
      parameters:
        - name: report
          in: query
          schema:
            type: string
            enum: [call_quality, daily_call_quality, reconciliation]
            default: call_quality
        - name: from
          in: query
          required: true
          description: Inclusive UTC date/time filter, YYYY-MM-DD or YYYY-MM-DD HH:MM:SS.
          schema:
            type: string
        - name: to
          in: query
          required: true
          description: Exclusive UTC date/time filter, YYYY-MM-DD or YYYY-MM-DD HH:MM:SS.
          schema:
            type: string
        - name: timezone
          in: query
          description: Time zone used by daily_call_quality.
          schema:
            type: string
            default: UTC
      responses:
        '200':
          description: Report rows or summary metrics.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /trunks.php:
    get:
      summary: List trunks or load one trunk by id
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - name: id
          in: query
          schema:
            type: integer
            minimum: 1
        - name: status
          in: query
          schema:
            type: integer
            enum: [0, 1]
      responses:
        '200':
          description: Trunk rows from cc_trunk.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
    post:
      summary: Create a trunk
      parameters:
        - name: X-A2BP-Actor
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trunk]
              properties:
                trunk:
                  type: object
                  required: [trunkcode, providertech, providerip]
                  properties:
                    trunkcode:
                      type: string
                      maxLength: 50
                    providertech:
                      type: string
                      enum: [SIP, IAX2, PJSIP]
                    providerip:
                      type: string
                      maxLength: 80
                    trunkprefix:
                      type: string
                      maxLength: 20
                    removeprefix:
                      type: string
                      maxLength: 20
                    status:
                      type: integer
                      enum: [0, 1]
      responses:
        '201':
          description: Trunk created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '422':
          $ref: '#/components/responses/ValidationError'
    put:
      summary: Update a trunk
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id, trunk]
              properties:
                id:
                  type: integer
                  minimum: 1
                trunk:
                  type: object
      responses:
        '200':
          description: Trunk updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiSuccess'
        '404':
          description: Trunk was not found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
