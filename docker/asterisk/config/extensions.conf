[globals]

[default]
exten => _X.,1,Goto(a2billingplus-sandbox,${EXTEN},1)

; ─────────────────────────────────────────────────────────────────────────────
; Multi-tenant internal context
;
; All tenant SIP devices land here (PJSIP endpoint context = a2billing-tenant).
; Endpoint naming: c{customerId}-{extension}  e.g. c123-100
;
; Tenant isolation: extract customerId from the calling endpoint name,
; then route to PJSIP/c{tenantId}-{dialed_extension} so tenant 123 dialing
; "100" reaches c123-100, not c456-100.
;
; Outbound (PSTN): any extension matching _+X. or 11 digits routes via A2Billing AGI.
; ─────────────────────────────────────────────────────────────────────────────
[a2billing]
include => a2billing-tenant

exten => _+X.,1,Goto(a2billing-tenant,${EXTEN:1},1)
exten => _1NXXNXXXXXX,1,Goto(a2billing-tenant,${EXTEN},1)
exten => _X.,1,Goto(a2billing-tenant,${EXTEN},1)

[a2billing-tenant]

; Extract tenant ID from the calling endpoint (c123-100 → 123)
exten => _X.,1,NoOp(Tenant internal call: ${CHANNEL(endpoint)} → ${EXTEN})
 same => n,Set(A2BP_EP=${CHANNEL(endpoint)})
 same => n,Set(A2BP_TENANT_PART=${CUT(A2BP_EP,-,1)})
 same => n,Set(A2BP_TENANT_ID=${FILTER(0-9,${A2BP_TENANT_PART})})
 same => n,GotoIf($["${A2BP_TENANT_ID}" = ""]?no_tenant,1)
 same => n,Set(A2BP_DEST=PJSIP/c${A2BP_TENANT_ID}-${EXTEN})
 same => n,NoOp(Routing to ${A2BP_DEST})
 same => n,Dial(${A2BP_DEST},30,rT)
 same => n,Goto(busy,1)

; Outbound PSTN — route through A2Billing rating AGI
exten => _+X.,1,NoOp(Tenant outbound E.164: ${EXTEN})
 same => n,Goto(a2billing-tenant,${EXTEN:1},1)

exten => _1NXXNXXXXXX,1,NoOp(Tenant outbound 11-digit NANP: ${EXTEN})
 same => n,AGI(/var/lib/asterisk/agi-bin/a2billingplus-agi,1)
 same => n,Hangup()

; Voicemail shortcut: *100 → voicemail for extension 100
exten => _*X.,1,NoOp(Voicemail check: ${EXTEN:1})
 same => n,VoiceMailMain(${EXTEN:1}@default)
 same => n,Hangup()

exten => busy,1,Busy(5)
exten => no_tenant,1,NoOp(Could not extract tenant from endpoint ${CHANNEL(endpoint)})
 same => n,Playback(invalid)
 same => n,Hangup()

; ─────────────────────────────────────────────────────────────────────────────
; Inbound DID / PSTN context
; ─────────────────────────────────────────────────────────────────────────────
[from-pstn]
exten => s,1,NoOp(Inbound PSTN call without URI user)
 same => n,AGI(/var/lib/asterisk/agi-bin/a2billingplus-agi,1,did)
 same => n,Hangup()

exten => _+X.,1,NoOp(Inbound PSTN DID call to ${EXTEN})
 same => n,AGI(/var/lib/asterisk/agi-bin/a2billingplus-agi,1,did)
 same => n,Hangup()

exten => _X.,1,NoOp(Inbound PSTN DID call to ${EXTEN})
 same => n,AGI(/var/lib/asterisk/agi-bin/a2billingplus-agi,1,did)
 same => n,Hangup()

; ─────────────────────────────────────────────────────────────────────────────
; Sandbox context (development / testing only)
; ─────────────────────────────────────────────────────────────────────────────
[a2billingplus-sandbox]
exten => _X.,1,NoOp(A2BillingPlus sandbox call to ${EXTEN})
 same => n,Answer()
 same => n,Playback(hello-world)
 same => n,Hangup()

exten => 1000,1,Answer()
 same => n,Playback(hello-world)
 same => n,Hangup()
