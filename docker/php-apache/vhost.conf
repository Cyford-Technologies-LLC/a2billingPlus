<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/a2billingplus-error.log
    CustomLog ${APACHE_LOG_DIR}/a2billingplus-access.log combined
</VirtualHost>
