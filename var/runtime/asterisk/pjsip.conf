[global]
type=global
user_agent=A2BillingPlus Sandbox
default_realm=asterisk
endpoint_identifier_order=auth_username,username,ip,anonymous

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[1001]
type=endpoint
context=a2billingplus-sandbox
disallow=all
allow=ulaw,alaw
auth=sandbox-auth
aors=1001
direct_media=no

[sandbox-auth]
type=auth
auth_type=userpass
username=1001
password=1001

[1001]
type=aor
max_contacts=1
remove_existing=yes
