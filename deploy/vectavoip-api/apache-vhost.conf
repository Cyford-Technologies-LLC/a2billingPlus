<VirtualHost *:80>
    ServerName api.vectavoip.com
    DocumentRoot /var/www/html

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/api/vectavoip/
    RewriteCond %{REQUEST_URI} !^/health\.php$
    RewriteRule ^ - [R=404,L]

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Frame-Options "DENY"

    ErrorLog ${APACHE_LOG_DIR}/vectavoip-api-error.log
    CustomLog ${APACHE_LOG_DIR}/vectavoip-api-access.log combined
</VirtualHost>
